name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk TVLite.apk
          ls -l TVLite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TVLite-apk
          path: TVLite.apk

      - name: Publish "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TVLite.apk \
            --title "TVLite (build ${{ github.run_number }})" \
            --notes "آخر نسخة من التطبيق. نزّل TVLite.apk وثبّته على الجهاز." \
            --target "${{ github.sha }}"
